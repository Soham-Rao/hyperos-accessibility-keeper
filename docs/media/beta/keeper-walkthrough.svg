<g transform="translate(0,337)"><rect x="72" width="576" height="96" rx="18" fill="#222b36"/><text x="96" y="39" font-size="26" font-weight="bold" fill="#f1f6fc">Voice helper</text><text x="96" y="70" font-size="20" fill="#bdc9d5">Recovered and bound</text></g>
<g transform="translate(0,450)"><rect x="72" width="576" height="96" rx="18" fill="#222b36"/><text x="96" y="39" font-size="26" font-weight="bold" fill="#f1f6fc">Gesture helper</text><text x="96" y="70" font-size="20" fill="#bdc9d5">Open app to finish connecting</text></g>
<text x="48" y="785" font-size="22" fill="#f1f6fc">Activity shows what Keeper could verify.</text>
<text x="48" y="846" font-size="18" fill="#aabaca">Sample services and events / Accessibility Keeper beta</text>
</g>
</g>
<g opacity='0'><animate attributeName='opacity' values='0;1;1;0' keyTimes='0;.07;.92;1' begin='loop.begin+20s' dur='5s' fill='freeze'/><animateTransform attributeName='transform' type='translate' values='16 0;0 0' begin='loop.begin+20s' dur='0.35s'/>
<g font-family="Arial">
<text x="48" y="64" font-size="19" fill="#87ddbc">ACCESSIBILITY KEEPER / ILLUSTRATED DEMO</text>
