<g transform="translate(0,337)"><rect x="72" width="576" height="96" rx="18" fill="#222b36"/><text x="96" y="39" font-size="26" font-weight="bold" fill="#f1f6fc">Secure settings</text><text x="96" y="70" font-size="20" fill="#bdc9d5">Restores the services you select</text></g>
