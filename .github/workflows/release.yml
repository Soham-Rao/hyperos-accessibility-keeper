name: Package signed beta candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-candidate
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD RELEASE_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing configuration: $name"
              exit 1
            fi
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          cache-read-only: true
      - name: Ensure Android SDK packages
        run: |
          packages=()
          [[ -f "$ANDROID_HOME/platforms/android-36/android.jar" ]] || packages+=('platforms;android-36')
          [[ -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]] || packages+=('build-tools;35.0.0')
          if (( ${#packages[@]} )); then sdkmanager "${packages[@]}"; fi
      - name: Build and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          umask 077
          export KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/keeper-signing.XXXXXX")"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          ./gradlew --no-daemon --build-cache --console=plain :app:assembleRelease
          bash scripts/package-candidate.sh "$ANDROID_HOME/build-tools/35.0.0" candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keeper-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
