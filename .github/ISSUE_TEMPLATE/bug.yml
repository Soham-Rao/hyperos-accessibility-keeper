name: Bug or device compatibility report
description: Something stopped working, or you tested another device.
title: '[Bug]: '
labels: []
body:
  - type: markdown
    attributes:
      value: 'Please share only what is necessary. Never include device serials, IMEI, accounts, tokens, private notifications or full system dumps. Logs and app names are optional.'
  - type: input
    id: version
    attributes:
      label: Keeper version
      description: Include whether this is a source/debug build or a published release.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android/HyperOS version
      placeholder: Model, Android version, firmware version
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Explain the steps, what you expected, and what happened instead. Mention the displayed service status if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional evidence
      description: A short sanitized journal excerpt, redacted screenshot or extra context. Share app names only if comfortable.
